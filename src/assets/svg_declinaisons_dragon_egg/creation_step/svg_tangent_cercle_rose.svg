<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Croix -->
  <path d="M100,0 C50,50 150,150 100,200" stroke="red" stroke-width="6" fill="none"/>
  <path d="M0,100 C50,50 150,150 200,100" stroke="blue" stroke-width="6" fill="none"/>

  <!-- Œuf -->
  <path d="M100,130 C60,130 80,60 100,60 C120,60 140,130 100,130 Z"
        fill="yellow" stroke="orange" stroke-width="3"/>

  <!-- Cercles -->
  <circle cx="115" cy="45" r="7" fill="green" stroke="black" stroke-width="2"/>
  <circle cx="128" cy="53" r="7" fill="purple" stroke="black" stroke-width="2"/>
  <circle cx="140" cy="65" r="7" fill="pink" stroke="black" stroke-width="2"/>

  <!-- Ligne -->
  <line x1="115" y1="45" x2="100" y2="95" stroke="black" stroke-width="2"/>

  <!-- Courbe corrigée (mêmes points, épouse le cercle) -->
  <path d="M100,95 
           C115,80 130,75 138,72 
           C145,70 145,60 128,53"
        stroke="brown" stroke-width="3" fill="none"/>

</svg>